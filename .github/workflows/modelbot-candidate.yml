name: Modelbot candidate

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
      key:
        type: string
        required: true
      model:
        type: string
        required: true
      revision:
        type: string
        required: true
      artifact:
        type: string
        required: true
      validate:
        type: boolean
        required: true
      validation-runner:
        type: string
        required: true

permissions: {}

jobs:
  validate:
    if: inputs.validate
    runs-on: ${{ inputs.validation-runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/plans
      - name: Validate candidate
        env:
          MODELBOT_KEY: ${{ inputs.key }}
          MODELBOT_MODEL: ${{ inputs.model }}
          MODELBOT_REVISION: ${{ inputs.revision }}
        run: |
          cp "$RUNNER_TEMP/plans/$MODELBOT_KEY/model.lock" model.lock
          bash .github/modelbot-validate

  publish:
    needs: validate
    if: >-
      ${{ !cancelled() &&
          (needs.validate.result == 'success' || needs.validate.result == 'failure' ||
           needs.validate.result == 'skipped') &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.event.repository.private == false &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/plans
      - name: Open update pull request
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          MODELBOT_BRANCH: ${{ inputs.branch }}
          MODELBOT_KEY: ${{ inputs.key }}
          MODELBOT_MODEL: ${{ inputs.model }}
          VALIDATION: ${{ needs.validate.result }}
        run: |
          python ../tool/publish.py --base "$BASE" --branch "$MODELBOT_BRANCH" \
            --model "$MODELBOT_MODEL" --plan "$RUNNER_TEMP/plans/$MODELBOT_KEY" \
            --validation "$VALIDATION"
